<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Monitoring Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
    Dispatch Monitoring Dashboard
</div>

<!-- ===========================
     FILTERS
=========================== -->

<div class="controls">

    <input
        type="text"
        id="searchBox"
        placeholder="🔍 Search CX Name">

    <select id="clusterFilter">
        <option value="ALL">All Clusters</option>
    </select>

    <select id="statusFilter">
        <option value="ALL">All Status</option>
        <option>Dispatched</option>
        <option>Completed</option>
        <option>Handled</option>
        <option>Unhandled</option>
    </select>

    <button id="clearFilters">
        Clear Filters
    </button>

</div>

<!-- ===========================
     TABLE
=========================== -->

<div class="table-container">

<table>

<thead>

<tr>

    <th rowspan="3" class="corner">
        CLUSTER / CX NAME
    </th>

    <th colspan="11" class="group-header dispatched">DISPATCHED</th>
    <th colspan="11" class="group-header completed">COMPLETED</th>
    <th colspan="11" class="group-header handled">HANDLED</th>
    <th colspan="11" class="group-header unhandled">UNHANDLED</th>

</tr>

<tr class="subheader">

    <!-- DISPATCHED -->
    <th rowspan="2">NC</th>
    <th rowspan="2">A/O</th>
    <th rowspan="2">IPTV</th>
    <th rowspan="2">NWUP</th>
    <th rowspan="2">RELOC</th>
    <th rowspan="2">AS</th>
    <th colspan="5">WAR</th>

    <!-- COMPLETED -->
    <th rowspan="2">NC</th>
    <th rowspan="2">A/O</th>
    <th rowspan="2">IPTV</th>
    <th rowspan="2">NWUP</th>
    <th rowspan="2">RELOC</th>
    <th rowspan="2">AS</th>
    <th colspan="5">WAR</th>

    <!-- HANDLED -->
    <th rowspan="2">NC</th>
    <th rowspan="2">A/O</th>
    <th rowspan="2">IPTV</th>
    <th rowspan="2">NWUP</th>
    <th rowspan="2">RELOC</th>
    <th rowspan="2">AS</th>
    <th colspan="5">WAR</th>

    <!-- UNHANDLED -->
    <th rowspan="2">NC</th>
    <th rowspan="2">A/O</th>
    <th rowspan="2">IPTV</th>
    <th rowspan="2">NWUP</th>
    <th rowspan="2">RELOC</th>
    <th rowspan="2">AS</th>
    <th colspan="5">WAR</th>

</tr>

<tr class="subheader">

    <!-- DISPATCHED -->
    <th>0D</th><th>1D</th><th>2D</th><th>3D</th><th>4-7D</th>

    <!-- COMPLETED -->
    <th>0D</th><th>1D</th><th>2D</th><th>3D</th><th>4-7D</th>

    <!-- HANDLED -->
    <th>0D</th><th>1D</th><th>2D</th><th>3D</th><th>4-7D</th>

    <!-- UNHANDLED -->
    <th>0D</th><th>1D</th><th>2D</th><th>3D</th><th>4-7D</th>

</tr>

</thead>

<tbody id="dispatchTable">

</tbody>

</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
