<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Monitoring Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
    Dispatch Monitoring Dashboard
</div>

<!-- ===========================
     FILTERS
=========================== -->

<div class="controls">

    <input
        type="text"
        id="searchBox"
        placeholder="🔍 Search CX Name">

    <select id="clusterFilter">
        <option value="ALL">All Clusters</option>
    </select>

    <div class="age-dropdown">
        <button
            type="button"
            id="ageDropdownBtn"
            class="filter-btn"
        >
            Aging ▼
        </button>
        <div id="ageFilterGroup" class="age-dropdown-content">
            <label>
                <input type="checkbox" value="0 D">
                0 D
            </label>
            <label>
                <input type="checkbox" value="1 D">
                1 D
            </label>
            <label>
                <input type="checkbox" value="2 D">
                2 D
            </label>
            <label>
                <input type="checkbox" value="3 D">
                3 D
            </label>
            <label>
                <input type="checkbox" value="4-7 D">
                4-7 D
            </label>
        </div>
    </div>
    
    <select id="lastMileFilter">
        <option value="ALL">All Last Mile</option>
    </select>
    
    <select id="statusFilter">
        <option value="DISPATCHED">Dispatched</option>
        <option value="COMPLETED">Completed</option>
        <option value="HANDLED">Handled</option>
        <option value="UNHANDLED">Unhandled</option>
    </select>

    <button id="clearFilters">
        Clear Filters
    </button>

    <button id="exportButton">
        Export
    </button>

</div>

<!-- ===========================
     TABLE
=========================== -->

<div class="table-container">

<table>

<thead>

<tr>

    <th rowspan="3" class="corner">
        CLUSTER / CX NAME
    </th>

    <th colspan="11" class="group-header dispatched">DISPATCHED</th>
    <th colspan="11" class="group-header completed">COMPLETED</th>
    <th colspan="11" class="group-header handled">HANDLED</th>
    <th colspan="11" class="group-header unhandled">UNHANDLED</th>

</tr>

<tr class="subheader">

    <!-- DISPATCHED -->
    <th rowspan="2">NC</th>
    <th rowspan="2">A/O</th>
    <th rowspan="2">IPTV</th>
    <th rowspan="2">NWUP</th>
    <th rowspan="2">RELOC</th>
    <th rowspan="2">AS</th>
    <th colspan="5">WAR</th>

    <!-- COMPLETED -->
    <th rowspan="2">NC</th>
    <th rowspan="2">A/O</th>
    <th rowspan="2">IPTV</th>
    <th rowspan="2">NWUP</th>
    <th rowspan="2">RELOC</th>
    <th rowspan="2">AS</th>
    <th colspan="5">WAR</th>

    <!-- HANDLED -->
    <th rowspan="2">NC</th>
    <th rowspan="2">A/O</th>
    <th rowspan="2">IPTV</th>
    <th rowspan="2">NWUP</th>
    <th rowspan="2">RELOC</th>
    <th rowspan="2">AS</th>
    <th colspan="5">WAR</th>

    <!-- UNHANDLED -->
    <th rowspan="2">NC</th>
    <th rowspan="2">A/O</th>
    <th rowspan="2">IPTV</th>
    <th rowspan="2">NWUP</th>
    <th rowspan="2">RELOC</th>
    <th rowspan="2">AS</th>
    <th colspan="5">WAR</th>

</tr>

<tr class="subheader">

    <!-- DISPATCHED -->
    <th>0D</th><th>1D</th><th>2D</th><th>3D</th><th>4-7D</th>

    <!-- COMPLETED -->
    <th>0D</th><th>1D</th><th>2D</th><th>3D</th><th>4-7D</th>

    <!-- HANDLED -->
    <th>0D</th><th>1D</th><th>2D</th><th>3D</th><th>4-7D</th>

    <!-- UNHANDLED -->
    <th>0D</th><th>1D</th><th>2D</th><th>3D</th><th>4-7D</th>

</tr>

</thead>

<tbody id="dispatchTable">

</tbody>

</table>

</div>

<!-- DRILL DOWN MODAL -->

<div id="detailModal" class="modal">

    <div class="modal-content">
    
        <span id="closeModal" class="close-btn">
            ×
        </span>
    
        <div id="modalBody"></div>
    
    </div>

</div>
    
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
